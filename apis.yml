  name: Tabby Disputes API
  description: >-
    The Disputes API is designed to simplify the process of handling disputes and help merchants resolve
    issues with customer orders more efficiently. Merchants can use this API to retrieve a list of disputes,
    view details about a specific dispute, and approve or challenge a bunch of disputes. It mirrors the
    functionality available in Tabby Merchant Dashboard and operates exclusively with live payments using
    live credentials. A secret key is required for using the Disputes API. <SchemaDefinition schemaRef="#/components/schemas/Webhook"
