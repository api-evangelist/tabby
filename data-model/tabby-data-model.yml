observations:
  - Captures and refunds have no list or retrieve endpoint. Reconciliation means re-reading the
    payment and diffing the arrays.
  - No customer entity. Buyer data is a per-session snapshot with no id, so there is nothing to look
    up a returning buyer by.
  - Dispute is the only entity that references another by an explicit foreign key (payment_id).
  - order_history and buyer_history are merchant-supplied risk inputs, not Tabby-owned records —
    they are written into the session, never read back as a resource.
