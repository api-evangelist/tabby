provider: Tabby
providerId: tabby
summary: >-
  Four root entities — CheckoutSession, Payment, Webhook and Dispute — over 91 schemas. Payment is
  the hub: it owns the captures and refunds arrays, carries the buyer, order and shipping snapshots,
  and is the entity Disputes and Webhooks both point back at by payment id. CheckoutSession and
  Payment are created together in a single POST and never exist apart. Captures and refunds are
  embedded arrays with no standalone endpoints, so a merchant reconciles them by re-reading the
  payment rather than by listing them.
identifiers:
  style: opaque string ids, no typed prefixes
  note: >-
    Unlike most payments APIs, Tabby ids carry no product prefix (no pay_, no ch_). The only way to
    tell a payment id from a dispute id is which field it came from. Merchant-side correlation is
    carried on order.reference_id, which the merchant sets and can update via putPayment.
  fields:
    - entity: CheckoutSession
      field: id
    - entity: Payment
      field: id
      schema: PaymentID
    - entity: Capture
      field: id
    - entity: Refund
      field: id
    - entity: Dispute
      field: id
      schema: DisputeID
    - entity: Webhook
      field: id
    - entity: Evidence
      field: id
  merchant_supplied:
    - field: order.reference_id
      purpose: The merchant's own order number. Mutable via putPayment; the only mutable field.
    - field: captures[].reference_id
      purpose: Doubles as the idempotency key for a capture.
    - field: refunds[].reference_id
      purpose: Doubles as the idempotency key for a refund.
    - field: meta.order_id
      purpose: Free correlation slot echoed back on payments and webhooks.
