  documentation host. The card advertises a single skill ("Tabby") pointing at a provider-published
  Agent Skill markdown file, and declares HTTP+JSON as the preferred transport. It is a documentation
  agent surface — it does not expose the money-moving Checkout/Payments/Disputes API directly.
