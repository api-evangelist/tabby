      url, provider.url and documentationUrl all resolve to https://docs.tabby.ai/ — the card
      describes the documentation agent surface (the same surface as the hosted MCP server at
      https://docs.tabby.ai/mcp), not the api.tabby.ai / api.tabby.sa transaction API.
