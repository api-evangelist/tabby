          type: string
          example: error
        errorType:
          type: string
          example: conflict
        error:
          type: string
          example: payment is disputed
    PaymentExpiresAt:
      type: string
      readOnly: true
      format: date-time
      description: Date and time the payment expires, in UTC, and displayed in ISO 8601 datetime format.
    PaymentID:
      type: string
      format: uuid
      example: payment id, uuid format
      readOnly: true
      description: Unique identifier for the payment (UUID), assigned by Tabby. Save it on your side!
    Pagination:
      type: object
      properties:
        limit:
          type: integer
          example: 20
          description: Limits the number of returned results.
        offset:
          type: integer
          example: 0
          description: Offset from which start returned results.
        total_count:
          type: integer
          example: 100
          description: Returned total item count.
    PaymentStatus:
      type: string
      readOnly: true
      enum:
      - CREATED
      - AUTHORIZED
      - CLOSED
      - REJECTED
      - EXPIRED
      example: CLOSED
      description: 'Status of the current payment:

        - `CREATED` means that the payment is created successfully, but not finished yet;

        - `AUTHORIZED` and `CLOSED` mark the successfully approved and captured payments accordingly;

        - `REJECTED` is returned when a customer is rejected during Tabby Checkout;

        - `EXPIRED` is used when a customer cancels a payment or when Tabby doesn''t receive a successfully paid transaction after timeout.

        '
    BuyerHistoryResponse:
      description: Customer information. `registered_since` (as a date of the customer's registration in the App), `loyalty_level` (as a number of successful orders) and `wishlist_count` (paid amount by a customer previously, e.g. 500) must be sent for Monthly Billing. `is_social_networks_connected` is also required for Monthly Billing.
      type: object
      properties:
        registered_since:
          type: string
          format: date-time
          description: Date and time the customer got registred with you, in UTC, and displayed in ISO 8601 datetime format.
        loyalty_level:
          type: number
          default: 0
          description: Customer's loyalty level within your store, should be sent as a number of successfully placed orders in the store with any payment methods.
        wishlist_count:
          type: number
          default: 0
          minimum: 0
          description: Number of items in Customer's wishlist.
        is_social_networks_connected:
          type: boolean
          nullable: true
          description: Is social network connected
        is_phone_number_verified:
          type: boolean
          nullable: true
          description: Is phone number verified
        is_email_verified:
          type: boolean
          nullable: true
          description: Is email verified
      required:
      - registered_since
      - loyalty_level
    OrderResponse:
      type: object
      nullable: true
      properties:
        reference_id:
          type: string
          nullable: true
          example: '1001'
          description: Merchant-assigned order number.
        updated_at:
          type: string
          format: date-time
          description: Date and time the order was last updated, in UTC, and displayed in ISO 8601 datetime format.
        tax_amount:
          type: string
          default: '0'
          example: '0.00'
          description: Total tax for the order.
        shipping_amount:
          type: string
          default: '0'
          example: '0.00'
          description: Total shipping cost for the order.
        discount_amount:
          type: string
          default: '0'
          example: '0.00'
          description: Total discount for the order. Should be positive or zero. Shows up on Tabby App for the Customer's convenience.
        items:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/OrderItemResponse'
          description: Array of objects representing the order items in this payment.
      required:
      - items
      - reference_id
  responses:
