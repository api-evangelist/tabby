provider: Tabby
providerId: tabby
summary: >-
  Tabby publishes first-party client SDKs for the four mobile platforms and first-party Magento 2
  modules on Packagist. Every one was resolved to a registry with a dated version. There is no
  server-side SDK for any backend language — no Node, Python, PHP, Java, Go, .NET or Ruby client for
  the Checkout/Payments/Disputes API exists, first-party or otherwise, so a backend integration is
  raw HTTP against api.tabby.ai / api.tabby.sa. The on-site messaging components (TabbyPromo,
  TabbyCard) are CDN-distributed with unpinned URLs and have no registry entry at all.
