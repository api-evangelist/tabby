gaps:
  - No first-party server-side SDK in any language for the Checkout/Payments/Disputes API.
  - No CocoaPods distribution for iOS; SPM only.
  - The two on-site messaging scripts are unpinned, so integrators cannot lock a version.
namespace_warning: >-
  npm's "tabby-*" namespace is dominated by the unrelated Tabby terminal emulator
  (tabby-core, tabby-terminal, tabby-settings and its plugin ecosystem). Only the packages listed
  above resolve to github.com/tabby-ai or the npm-repo@tabby.ai maintainer account.
