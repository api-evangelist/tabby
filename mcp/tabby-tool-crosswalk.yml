    path: openapi/_original/tabby-api-openapi.yml
    servers:
      - https://api.tabby.ai
      - https://api.tabby.sa
    auth: http bearer (secret_key)
    gated: true
    note: All 19 operations require a merchant secret key; no anonymous surface.
  mcp:
    url: https://docs.tabby.ai/mcp
    auth: none
    gated: false
