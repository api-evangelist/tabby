provider: Tabby
providerId: tabby
summary: >-
  Tabby publishes both a hosted MCP server and an OpenAPI 3.1 contract, but they do not overlap at
  all. The MCP server is a documentation retrieval surface (search, virtual-filesystem query,
  feedback); the OpenAPI describes 19 money-moving REST operations. Not one MCP tool binds to a REST
  operationId, and not one REST operation is reachable from an MCP client. This is the cleanest
  possible example of the divergence this crosswalk exists to record: an agent connected to Tabby's
  MCP server can read about a refund but cannot issue one.
surfaces:
